name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Instalar pnpm
        uses: pnpm/action-setup@v6

      - name: Configurar Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Tests
        run: pnpm test

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      # Chromium para el test web; el test lo localiza en ~/.cache/ms-playwright.
      - name: Instalar Chromium
        run: pnpm exec playwright-core install --with-deps chromium

      - name: Test web (funcionalidad y eficiencia)
        run: node --test site-tests/web.spec.mjs
