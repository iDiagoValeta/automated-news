name: Edición diaria

on:
  schedule:
    # Objetivo: publicar a mediodía en Europe/Madrid, en tarifa valle de DeepSeek.
    # Pico de DeepSeek: 01:00–04:00 y 06:00–10:00 UTC (el resto es valle, a mitad
    # de precio). GitHub Actions retrasa u OMITE crons cuando está cargada, así
    # que hay varios reintentos horarios ya dentro del valle. El guardián de más
    # abajo solo deja correr el schedule si son las 10:00 UTC o más; la
    # idempotencia por fichero (data/AAAA-MM-DD.json, fecha en Madrid) hace que
    # solo el primer intento válido genere la edición.
    # 10:15 UTC = 12:15 en verano (CEST) y 11:15 en invierno (CET).
    - cron: "15 10 * * *"
    - cron: "15 11 * * *"
    - cron: "15 12 * * *"
    - cron: "15 13 * * *"
    - cron: "15 14 * * *"
  workflow_dispatch:
    inputs:
      skip_pipeline:
        description: "Solo reconstruir y desplegar el sitio, sin regenerar la edición"
        type: boolean
        default: false

concurrency:
  group: diario-ia
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

jobs:
  edicion:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ventana horaria (valle DeepSeek, a partir de las 10:00 UTC)
        id: guard
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Disparo manual: se ejecuta sin comprobar la hora."
            exit 0
          fi
          # Hora UTC: evita pico 06:00–10:00 aunque GitHub dispare un cron pronto.
          # A las ≥10:00 UTC en Madrid siempre es el mismo día civil (11:00 CET / 12:00 CEST).
          hora_utc=$((10#$(date -u +%H)))
          if [ "$hora_utc" -ge 10 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "UTC >= 10:00 (hora $hora_utc): valle DeepSeek, se ejecuta."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "UTC aún no son las 10:00 (hora $hora_utc): se omite hasta el siguiente cron."
          fi

      - name: Instalar pnpm
        if: steps.guard.outputs.run == 'true'
        uses: pnpm/action-setup@v4

      - name: Configurar Node
        if: steps.guard.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Instalar dependencias
        if: steps.guard.outputs.run == 'true'
        run: pnpm install --frozen-lockfile

      - name: Ejecutar pipeline (recogida, enriquecimiento, curación, posts)
        if: steps.guard.outputs.run == 'true' && ! inputs.skip_pipeline
        env:
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'deepseek' }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-v4-flash' }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: pnpm run pipeline

      - name: Construir sitio (Eleventy)
        if: steps.guard.outputs.run == 'true'
        run: pnpm run build

      - name: Commit de la edición del día
        if: steps.guard.outputs.run == 'true'
        run: |
          git config user.name "deepseek-v4"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Sin cambios en data/: no se crea commit."
          else
            git commit -m "edición $(TZ='Europe/Madrid' date +%Y-%m-%d)"
            # Integra cambios remotos aparecidos durante la ejecución antes de
            # publicar, para que un push concurrente no tumbe la edición.
            git pull --rebase origin main
            git push
          fi

      - name: Configurar Pages
        if: steps.guard.outputs.run == 'true'
        uses: actions/configure-pages@v5

      - name: Subir artefacto de Pages
        if: steps.guard.outputs.run == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Desplegar en GitHub Pages
        id: deploy
        if: steps.guard.outputs.run == 'true'
        uses: actions/deploy-pages@v4

      - name: Abrir issue si el workflow falla
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Fallo en la edición diaria (${new Date().toISOString().slice(0,10)})`,
              body: [
                "El workflow **Edición diaria** ha fallado y no se ha publicado una edición nueva.",
                "",
                `- Run: ${run}`,
                "- Revisa los logs del job para el error concreto (recogida, enriquecimiento, curación, posts o deploy).",
                "- Si el cron dejó de dispararse sin motivo, comprueba si GitHub deshabilitó el workflow por inactividad (60 días).",
              ].join("\n"),
              labels: ["fallo-automatico"],
            });
